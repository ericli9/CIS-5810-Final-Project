[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcheckout"
version = "0.1.0"
description = "Vision-based grocery auto-checkout and scan-gate loss prevention (CIS 5810 final project)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.3",
    "opencv-python>=4.9",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smartcheckout = "smartcheckout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartcheckout = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
